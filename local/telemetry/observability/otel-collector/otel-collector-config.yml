# ==============================================================================
# OpenTelemetry Collector Configuration (otel-collector-config.yml)
# ==============================================================================
# Receives metrics over OTLP gRPC (:4317) and HTTP (:4318), batches them,
# and exports them for Prometheus scraping on :8889.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  batch:
    timeout: 1s
    send_batch_size: 100

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: "egg"
    send_timestamps: true
    add_metric_suffixes: false
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
