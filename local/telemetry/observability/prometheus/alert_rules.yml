# ==============================================================================
# Prometheus Recording & Alerting Rules (alert_rules.yml)
# ==============================================================================
# 1. Recording Rules (`record:`): Pre-compute rates and raw histogram quantiles.
# 2. Alerting Rules (`alert:` + `for:`): Hysteresis-debounced raw-metric alerts.

groups:
  - name: egg_raw_recording_rules
    interval: 5s
    rules:
      # Keystroke velocity per minute from monotonic counter
      - record: egg:keystrokes:rate1m
        expr: rate(egg_user_keystrokes_total[1m]) * 60

      # Context switch velocity per minute from monotonic counter
      - record: egg:context_switches:rate1m
        expr: rate(egg_user_context_switches_total[1m]) * 60

      # 95th percentile raw inter-keystroke interval (ms)
      - record: egg:iki_ms:p95
        expr: histogram_quantile(0.95, sum(rate(egg_user_iki_ms_bucket[5m])) by (le))

      # 95th percentile raw key hold duration (ms)
      - record: egg:hold_time_ms:p95
        expr: histogram_quantile(0.95, sum(rate(egg_user_hold_time_hist_ms_bucket[5m])) by (le))

  - name: egg_raw_hysteresis_alerts
    interval: 5s
    rules:
      # High context switch rate (>6 switches in 60s window sustained for 60s)
      - alert: HighWindowContextSwitching
        expr: egg_user_window_context_switches > 6
        for: 60s
        labels:
          severity: warning
        annotations:
          summary: "High context switching (>6 switches in 60s window)"
          description: "Window context switches exceeded 6 for 60s continuously."

      # Continuous session ceiling (>90 minutes unbroken session)
      - alert: ExtendedContinuousFocusSession
        expr: egg_user_session_uptime_seconds >= 5400
        for: 60s
        labels:
          severity: info
        annotations:
          summary: "90-minute ultradian focus block reached"
          description: "Continuous session uptime has reached 90 minutes without a 15-minute reset."
