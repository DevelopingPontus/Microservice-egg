# ==============================================================================
# Prometheus TSDB Configuration (prometheus.yml)
# ==============================================================================
# Scrapes metrics exported by the OpenTelemetry Collector (:8889) every 2 seconds
# and evaluates recording + hysteresis alerting rules from alert_rules.yml.

global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "egg-otel-collector"
    static_configs:
      - targets:
          - "otel-collector:8889"
        labels:
          service: "egg-telemetry"
          tier: "local-client"
