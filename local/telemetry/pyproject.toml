[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-telemetry"
version = "0.1.0"
description = "Local privacy-preserving fatigue telemetry collector and Prometheus evaluator"
requires-python = ">=3.11"
dependencies = [
    "pynput>=1.7.6",
    "prometheus-client>=0.20.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
webcam = [
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.0,<0.10.20",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.setuptools]
packages = ["telemetry"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"telemetry/__init__.py" = ["F401"]
