[project]
name = "local-telemetry"
version = "0.1.0"
description = "Local privacy-preserving fatigue telemetry collector and Prometheus evaluator"
requires-python = ">=3.11"
dependencies = [
    "pynput>=1.7.6",
    "prometheus-client>=0.20.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
webcam = [
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.0,<1.2.4",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["telemetry"]
