global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "egg-local-agent"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "host.docker.internal:8765"
        labels:
          service: "egg-local-agent"
          tier: "local-host-daemon"
