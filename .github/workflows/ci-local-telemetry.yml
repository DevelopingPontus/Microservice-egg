name: "CI — Local Telemetry (Python 3.12 + uv)"

on:
  push:
    branches: ["main"]
    paths:
      - "local/telemetry/**"
      - ".github/workflows/ci-local-telemetry.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "local/telemetry/**"
      - ".github/workflows/ci-local-telemetry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-local-telemetry:
    name: "Verify (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: local/telemetry
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "local/telemetry/uv.lock"
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Gate 1 — Lint (ruff)
        run: uv run ruff check telemetry tests run.py cli.py

      - name: Gate 2 — Automated Tests & Coverage (pytest)
        run: uv run pytest -v --cov=telemetry
